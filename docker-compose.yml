services:
  mysql:
    image: mysql:8.0
    container_name: academic_integration_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: academic_db
    ports:
      - "3308:3306"
    volumes:
      - mysql_academic_data:/var/lib/mysql

volumes:
  mysql_academic_data:
