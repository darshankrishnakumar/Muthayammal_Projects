server.port=8080
spring.application.name=telecom-churn-prediction-backend

# Primary Database: MySQL 8.0+ / MariaDB
# Reads configuration from environment variables with safe localhost defaults
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:telecom_churn}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=TelecomChurnMySQLPool

# JPA / Hibernate for MySQL Relational Database
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Python ML Inference Service URL
ml.service.url=${ML_SERVICE_URL:http://127.0.0.1:8000}
ml.service.connect-timeout-ms=5000
ml.service.read-timeout-ms=10000

# CORS settings
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}

# Logging
logging.level.com.telecom.churn=INFO
