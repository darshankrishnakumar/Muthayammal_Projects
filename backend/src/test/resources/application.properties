# Test configuration: isolated in-memory H2 database. Never point tests at a real MySQL.
spring.profiles.active=test
spring.flyway.enabled=false
spring.datasource.url=jdbc:h2:mem:academic_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE,USER,YEAR
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test-only signing key (not used anywhere else)
academic.jwt.secret=dGVzdC1vbmx5LWp3dC1zZWNyZXQta2V5LWZvci11bml0LWFuZC1pbnRlZ3JhdGlvbi10ZXN0cw==
academic.jwt.expiration-ms=3600000
academic.cors.allowed-origins=http://localhost:5173
academic.storage.root=target/test-storage
academic.flyway.repair-on-start=false
academic.payments.simulation-enabled=true
academic.payments.currency=INR
academic.seed.demo-accounts=true
academic.library.import-root=
audit.log.enabled=true
audit.log.level=ALL
