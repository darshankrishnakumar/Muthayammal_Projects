# ==============================================================================
# Shared configuration. Every secret is read from the environment.
#
# Local development: copy application-local.properties.example to
# application-local.properties (git-ignored) and run with the default "local" profile.
# Production: set SPRING_PROFILES_ACTIVE=prod and provide the environment variables
# documented in README.md. The app refuses to start without a strong JWT_SECRET.
# ==============================================================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=${PORT:8080}

# Database (MySQL 8.x)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/academic_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# Embedded Tomcat thread pool
server.tomcat.threads.max=300
server.tomcat.threads.min-spare=25
server.tomcat.accept-count=500
server.tomcat.max-connections=10000

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=true
# Running "flyway repair" on every boot hides checksum drift; keep it off outside local dev.
academic.flyway.repair-on-start=${FLYWAY_REPAIR_ON_START:false}

# JWT: base64-encoded secret of at least 256 bits (32 bytes). Required.
academic.jwt.secret=${JWT_SECRET:}
academic.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS: comma-separated list of allowed browser origins (no wildcards with credentials)
academic.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Response compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# File uploads (videos, source archives, documents)
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:500MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:500MB}
academic.upload.max-file-size-bytes=${MAX_UPLOAD_BYTES:524288000}
# Private on-disk storage root for deliverables (never served statically)
academic.storage.root=${STORAGE_ROOT:uploads}

# Library importer: local checkout of the master project repository (Super Admin import)
academic.library.import-root=${LIBRARY_IMPORT_ROOT:}

# Payments. No real gateway is configured yet. Simulation records clearly labelled
# SIMULATED transactions and must stay disabled in production.
academic.payments.provider=${PAYMENT_PROVIDER:simulated}
academic.payments.simulation-enabled=${PAYMENTS_SIMULATION_ENABLED:false}
academic.payments.currency=${PAYMENT_CURRENCY:INR}

# Demo accounts (superadmin/admin/user with well-known passwords). Never enable in production.
academic.seed.demo-accounts=${SEED_DEMO_ACCOUNTS:false}

# Audit log volume: ALL, MODERATE (mutations and governance), CRITICAL (security and deletions)
audit.log.enabled=true
audit.log.level=${AUDIT_LOG_LEVEL:MODERATE}
