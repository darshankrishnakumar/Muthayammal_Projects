# Server Port Configuration
server.port=8080

# Database Configuration (Local MySQL 8.x)
spring.datasource.url=jdbc:mysql://localhost:3306/academic_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=REMOVED_DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# HikariCP Connection Pool High-Performance Tuning
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# Embedded Tomcat High-Concurrency Thread Pool Tuning
server.tomcat.threads.max=300
server.tomcat.threads.min-spare=25
server.tomcat.accept-count=500
server.tomcat.max-connections=10000

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=true

# Custom JWT parameters
# Secret key must be a base64-encoded string of at least 256 bits (32 bytes)
academic.jwt.secret=REMOVED_LEAKED_JWT_SECRET
academic.jwt.expiration-ms=86400000

# High-Speed Response GZIP Compression (Compresses JSON & text payloads over network)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# File and Media Upload Configuration (Videos, Images, Documents)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Audit Log Volume & Filtering Configuration
# audit.log.level options: ALL, MODERATE (default: mutations & governance), CRITICAL (high-impact security & deletions only)
audit.log.enabled=true
audit.log.level=MODERATE

