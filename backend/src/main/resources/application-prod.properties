# Production profile. All secrets must come from the environment.
# Flyway owns the schema in production (V1-V14 verified against MySQL 8 with validate)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
academic.flyway.repair-on-start=false
academic.payments.simulation-enabled=false
academic.seed.demo-accounts=false
server.error.include-message=never
server.error.include-stacktrace=never
logging.level.com.academic=INFO
