version: '3.8'

services:
  project55-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: project55_enterprise_api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./data/project55_enterprise.db
      - DEFAULT_CONFIDENCE_THRESHOLD=0.65
      - AUTO_DISPATCH_ENABLED=true
    volumes:
      - ../data:/app/data
      - ../experiments:/app/experiments
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional reverse proxy / SSL termination for enterprise deployments
  nginx-proxy:
    image: nginx:alpine
    container_name: project55_nginx
    ports:
      - "80:80"
    depends_on:
      - project55-api
    restart: unless-stopped
